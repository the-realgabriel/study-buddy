<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fafaf9">
  <title>Study Buddy</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" crossorigin="anonymous">
  <link rel="stylesheet" href="/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" crossorigin="anonymous"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <button id="menuBtn" class="icon-btn menu-btn" aria-label="Open notes menu" aria-expanded="false">&#9776;</button>
      <div class="topbar-brand">
        <div class="logo small">SB</div>
        <span>Study Buddy</span>
      </div>
      <button id="newNoteTopBtn" class="btn small primary">New note</button>
    </header>
    <aside class="sidebar">
      <div class="brand">
        <div class="logo">SB</div>
        <div>
          <h1>Study Buddy</h1>
          <p>notes in, quizzes out</p>
        </div>
      </div>
      <button id="newNoteBtn" class="btn primary wide">New note</button>
      <input id="searchInput" class="search" type="search" placeholder="Search notes" autocomplete="off">
      <nav id="noteList" class="note-list"></nav>
      <div class="sidebar-foot">
        <button id="historyBtn" class="btn ghost wide">History</button>
        <button id="logoutBtn" class="btn ghost wide">Log out</button>
        <div id="providerPill" class="pill">loading</div>
      </div>
    </aside>
    <main class="main">
      <div id="view" class="view"></div>
    </main>
  </div>

  <div id="sidebarBackdrop" class="backdrop"></div>

  <div id="noteModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="noteModalTitle">New note</h2>
        <button class="icon-btn" data-close="noteModal" aria-label="Close">×</button>
      </div>
      <label class="field">
        <span>Title</span>
        <input id="noteTitle" type="text" placeholder="e.g. Cell biology — chapter 4">
      </label>
      <div class="field">
        <span>Notes</span>
        <div id="dropZone" class="drop-zone">
          <textarea id="noteContent" placeholder="Paste your notes here, or drop a file below."></textarea>
          <div class="drop-actions">
            <button id="importBtn" type="button" class="btn small">Import files</button>
            <span class="hint">.txt, .md, .csv, .docx, .pdf, .pptx — multiple at once</span>
            <input id="fileInput" type="file" accept=".txt,.md,.markdown,.csv,.docx,.pdf,.pptx" multiple hidden>
          </div>
          <div id="pendingFiles" class="chips"></div>
        </div>
      </div>
      <div class="sheet-foot">
        <button class="btn ghost" data-close="noteModal">Cancel</button>
        <button id="saveNoteBtn" class="btn primary">Save note</button>
      </div>
    </div>
  </div>

  <div id="genModal" class="modal hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2>Generate a quiz</h2>
        <button class="icon-btn" data-close="genModal" aria-label="Close">×</button>
      </div>
      <div class="grid-2">
        <label class="field">
          <span>Questions</span>
          <select id="genCount">
            <option value="5">5</option>
            <option value="8" selected>8</option>
            <option value="10">10</option>
            <option value="15">15</option>
            <option value="20">20</option>
          </select>
        </label>
        <label class="field">
          <span>Difficulty</span>
          <select id="genDifficulty">
            <option value="easy">Easy</option>
            <option value="medium" selected>Medium</option>
            <option value="hard">Hard</option>
          </select>
        </label>
      </div>
      <div class="field">
        <span>Question types</span>
        <div class="checks">
          <label class="check"><input type="checkbox" id="typeMc" checked><span>Multiple choice</span></label>
          <label class="check"><input type="checkbox" id="typeTf" checked><span>True / false</span></label>
          <label class="check"><input type="checkbox" id="typeSa" checked><span>Short answer</span></label>
        </div>
      </div>
      <p class="hint">Questions are written only from the selected note. Short answers are graded by the model.</p>
      <div class="sheet-foot">
        <button class="btn ghost" data-close="genModal">Cancel</button>
        <button id="genBtn" class="btn primary">Generate quiz</button>
      </div>
    </div>
  </div>

  <div id="authModal" class="modal auth-gate hidden" role="dialog" aria-modal="true">
    <div class="sheet">
      <div class="sheet-head">
        <h2 id="authTitle">Sign in</h2>
      </div>
      <label class="field">
        <span>Username</span>
        <input id="authUser" type="text" autocomplete="username" spellcheck="false">
      </label>
      <label class="field">
        <span id="authPassLabel">Password</span>
        <input id="authPass" type="password" autocomplete="current-password">
      </label>
      <label class="field hidden" id="authCodeField">
        <span>Invite code</span>
        <input id="authCode" type="text" autocomplete="off" spellcheck="false">
      </label>
      <p id="authError" class="hint" style="color:#b33b2e"></p>
      <div class="sheet-foot">
        <button id="authToggleBtn" class="btn ghost">New here? Register</button>
        <button id="authSubmitBtn" class="btn primary">Sign in</button>
      </div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>
  <script src="/app.js" defer></script>
</body>
</html>
